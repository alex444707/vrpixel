<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Каталог Игр</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
body { background: #121214; color: #fff; padding: 20px; padding-bottom: 60px; }

h1 { text-align: center; margin-bottom: 25px; color: #00ffcc; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px; }

/* Кнопки фильтров */
.filters { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; position: sticky; top: 0; background: #121214; padding: 10px 0; z-index: 100; }
.filter-btn { background: #232329; border: 2px solid #3e3e4a; color: #fff; padding: 12px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
.filter-btn.active { background: #00ffcc; color: #000; border-color: #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.4); }

/* Сетка игр */
.catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }

/* Карточка игры */
.game-card { background: #1c1c22; border-radius: 20px; overflow: hidden; border: 1px solid #2d2d37; display: flex; flex-direction: column; transition: transform 0.2s; }
.game-card.hidden { display: none; }

/* Картинка / Заглушка */
.game-img { width: 100%; height: 180px; object-fit: cover; background: #2d2d37; display: flex; align-items: center; justify-content: center; color: #666; font-size: 3rem; position: relative; }

/* Бейджи на картинке */
.badge-age { position: absolute; top: 12px; left: 12px; background: #ff0055; color: #fff; padding: 4px 10px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; }
.badge-players { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 10px; border-radius: 10px; font-size: 0.9rem; font-weight: bold; }

/* Инфо внутри карточки */
.game-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
.game-title { font-size: 1.4rem; margin-bottom: 8px; color: #fff; }
.game-desc { font-size: 0.95rem; color: #b3b3b3; line-height: 1.4; margin-bottom: 15px; flex-grow: 1; }

/* Теги особенностей */
.game-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { background: #2a2a35; color: #00ffcc; padding: 5px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 500; }
</style>
</head>
<body>

<h1>🎮 Выбери свою игру</h1>

<!-- Блок фильтров (категории) -->
<div class="filters">
<button class="filter-btn active" onclick="filterGames('all', this)">✨ Все игры</button>
<button class="filter-btn" onclick="filterGames('kids', this)">🐣 Для младших</button>
<button class="filter-btn" onclick="filterGames('action', this)">🎯 Стрелялки / Экшен</button>
<button class="filter-btn" onclick="filterGames('funny', this)">🥳 Веселые / Симуляторы</button>
</div>

<!-- Каталог игр -->
<div class="catalog">



<!-- ИГРА 3 -->
<div class="game-card" data-category="action">
<img class="game-img" src="C:\Users\tolia\OneDrive\Рабочий стол\img\1.jpg" alt="Superhot VR">
<div class="badge-age">12+</div>
<div class="badge-players">🧍 1 чел</div>
<div class="game-info">
<h3 class="game-title">Superhot VR</h3>
<p class="game-desc">Время двигается только тогда, когда двигаешься ты. Уворачивайся от пуль как в Матрице и планируй каждый шаг.</p>
<div class="game-tags">
<span class="tag">#Стрелялка</span>
<span class="tag">#Тактика</span>
<span class="tag">#Круто</span>
</div>
</div>
</div>



</div>

<!-- Скрипт переключения категорий -->
<script>
function filterGames(category, button) {
// Меняем активную кнопку
document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
button.classList.add('active');

// Фильтруем карточки
document.querySelectorAll('.game-card').forEach(card => {
const categories = card.getAttribute('data-category').split(' ');
if (category === 'all' || categories.includes(category)) {
card.classList.remove('hidden');
} else {
card.classList.add('hidden');
}
});
}
</script>
</body>
</html>
